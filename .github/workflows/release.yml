name: Build and publish desktop releases

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

# L-03（r7-lunafix）最小权限：workflow 级只读——build/publish 原先各自
# 继承 contents: write，构建/测试步骤（pip 安装、pytest、校验器）因此持有
# 写令牌（供应链爆炸半径）。写权限只下沉到真正打标签/建发行版的 publish
# 作业；build 的 checkout 不把凭据持久化进本地 git 配置。
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            command: windows
            artifact: ReviewFlow-Setup-x64.exe
          - platform: macos-arm64
            runner: macos-15
            command: macos
            artifact: ReviewFlow.dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            command: linux
            artifact: ReviewFlow-x86_64.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          # L-03：构建/测试作业不需要凭据——不把令牌留进本地 git 配置
          #（后续 pip 安装/pytest/校验器执行的代码一律拿不到写凭据）。
          persist-credentials: false
      - name: Read application version
        shell: bash
        run: echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        if: matrix.command == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config libfuse2
      - name: Install macOS Cairo rendering library
        if: matrix.command == 'macos'
        shell: bash
        run: |
          brew install cairo
          cairo_lib="$(brew --prefix cairo)/lib"
          test -f "$cairo_lib/libcairo.2.dylib"
          echo "REVIEWFLOW_CAIRO_LIB_DIR=$cairo_lib" >> "$GITHUB_ENV"
      - name: Install Windows installer compiler
        if: matrix.command == 'windows'
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        if: matrix.command == 'windows'
        shell: cmd
        run: build\build_windows.bat __inner__
      - name: Build macOS disk image
        if: matrix.command == 'macos'
        env:
          REVIEWFLOW_MACOS_ARCH: arm64
        run: bash build/build_macos.sh
      - name: Build Linux AppImage
        if: matrix.command == 'linux'
        run: bash build/build_linux.sh
      - name: Collect release file
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ matrix.command }}" = windows ]; then
            cp build/Output/${{ matrix.artifact }} release-assets/
          else
            cp build/dist/${{ matrix.artifact }} release-assets/
          fi
      - name: Provision playwright for the browser regression
        shell: bash
        run: |
          # MM9-01: the only browser regression in the release gate
          # (build/tests/import_review_browser.cjs, spawned by
          # test_r7_mm7_relchain.py) is skipif-gated on BOTH
          # REVIEWFLOW_PLAYWRIGHT (a require() path to the playwright module,
          # the convention every build/tests/*.cjs harness uses) and
          # PLAYWRIGHT_BROWSERS_PATH (the browser cache). Without this step
          # the gate ships zero browser coverage while looking green.
          pw_root="$RUNNER_TEMP/reviewflow-playwright"
          npm install --prefix "$pw_root" "playwright@>=1.55.0 <2"
          pw_cli="$pw_root/node_modules/playwright/cli.js"
          if [ "${{ matrix.command }}" = "linux" ]; then
            PLAYWRIGHT_BROWSERS_PATH="$pw_root/browsers" node "$pw_cli" install --with-deps chromium
          else
            PLAYWRIGHT_BROWSERS_PATH="$pw_root/browsers" node "$pw_cli" install chromium
          fi
          {
            echo "REVIEWFLOW_PLAYWRIGHT=$pw_root/node_modules/playwright"
            echo "PLAYWRIGHT_BROWSERS_PATH=$pw_root/browsers"
          } >> "$GITHUB_ENV"
      - name: Verify versioned application payload
        run: python build/verify_release_payload.py ${{ matrix.command }}
      - name: Run static validators
        shell: bash
        env:
          PYTHONUTF8: "1"
          # r9 系测试的可写根：本地缺省 E:/rf214tmp（本波期 C: 盘满的历史
          # 原因），CI 无 E: 盘——模块级 mkdir 在收集期直接 FileNotFoundError
          # （2026-11-13 windows-x64 实红）。五个 r9 文件统一走此逃生门。
          RF_R9_TMP: ${{ runner.temp }}
          # 2026-11-13 全域扫除：另有 10 个 py+3 个 cjs 在运行期硬编码
          # E:/rf214tmp（本地有 E: 盘从未暴露）——已全部改写为可覆写。
          # 注意：不加子目录后缀——r9-l6b/l7c 的深链任务备份文件名极长
          # （research-trace pre-migration bak ≈107 字符），Windows MAX_PATH
          # 260 贴边，根每多一级即爆（f1_72 教训：开发者当年挪 E: 盘即此因）。
          RF_R9_TMP_ROOT: ${{ runner.temp }}
        run: |
          # MM7-02: the full static gate runs in CI after the payload check;
          # any non-zero exit fails the job. build/requirements-test.txt
          # (Task5, 2.1.6) is the single source for the verification extras
          # on top of the runtime requirements (it -r-includes
          # requirements-app.txt): pytest, the pyyaml the workflow static
          # nails parse with, httpx for the Python validators that import it,
          # and httpx2 for TestClient.
          python -m pip install --disable-pip-version-check -r build/requirements-test.txt
          if [ "${{ matrix.command }}" = macos ]; then
            export DYLD_LIBRARY_PATH="$REVIEWFLOW_CAIRO_LIB_DIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          fi
          # TST-03 (2.1.6 Task 8): the gate - whole-directory pytest (MM8-02,
          # 1,222+ assertions), the six static validators (MM7-02: 3 Python +
          # 3 Node, including the two that were green but unwired before
          # 2.1.6) and all 24 node --test behaviour suites (MM11-01/W2/W3) -
          # runs through the single validation entry CI and the local full
          # validation run share. The three packaging scripts call the six
          # validators directly, not this full entry. The command plan lives
          # only in build/run_validation.py (single source; --list/--json
          # exports the real argv), never hand-copied in this workflow. The
          # 2026-11-13 five-file pytest segmentation ended here: the 2.1.6
          # conftest (Task 2) restores per-module isolation, so the suite
          # runs whole again.
          python build/run_validation.py --log-dir "$RUNNER_TEMP/validation-logs"
      - uses: actions/upload-artifact@v6
        with:
          name: reviewflow-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          # F1 (2.1.6 R1): the artifact name is fixed per platform, so a rerun
          # of the same run must explicitly overwrite the previous upload.
          overwrite: true

  assemble:
    name: Assemble and verify release assets
    # REL-02b（2.1.6 Task8 主控裁定）：publish 收口为仅 push 标签事件后，
    # 分支推送与 workflow_dispatch 演练原先不再经过 download/汇集/SHA 校验
    # （原 REL-01 验收缺一段）。本作业把产物汇集与校验从 publish 前移为
    # 只读作业：任何触发面（含演练）都全链路复现产物传输、六载荷完整性
    # 与 checksum 校验；publish 只按名取走这份已验证的完整资产包。
    needs: build
    runs-on: ubuntu-22.04
    # 只读产物准备：无检出、无写凭据、无仓库写权限。
    permissions:
      contents: read
    steps:
      - name: Download platform artifacts
        # 固定产物名 reviewflow-<platform>：同一 run 重跑时同名产物覆盖，
        # 且 download-artifact 只取本 run 的产物——不存在跨 run 旧平台包
        # 混入路径。
        uses: actions/download-artifact@v7
        with:
          pattern: reviewflow-*
          path: release-assets
          merge-multiple: true
      - name: Verify release asset completeness
        run: |
          # REL-02：download-artifact 的 merge-multiple 只交付"存在的"产物——
          # 缺件不报错，不完整资产集不得进入校验与上传。六件资产（三平台
          # 安装包 + verify_release_payload.py 写出的三份 build-manifest）
          # 缺一即败；publish 侧保留同型检查作双保险（防资产包被替换）。
          cd release-assets
          missing=0
          for f in ReviewFlow-Setup-x64.exe ReviewFlow.dmg ReviewFlow-x86_64.AppImage \
                   build-manifest-windows.json build-manifest-macos.json build-manifest-linux.json; do
            if [ ! -f "$f" ]; then
              echo "::error::missing release asset: $f" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release assets incomplete; refusing to assemble" >&2
            exit 1
          fi
      - name: Generate checksums
        run: |
          # 显式六载荷清单生成 SHA256SUMS.txt：清单永不包含自身（重定向
          # 创建的文件不在参数列表内），也不吸收目录里任何多余文件。
          cd release-assets
          sha256sum ReviewFlow-Setup-x64.exe ReviewFlow.dmg ReviewFlow-x86_64.AppImage \
                    build-manifest-windows.json build-manifest-macos.json build-manifest-linux.json \
            > SHA256SUMS.txt
      - name: Verify checksums
        # assemble 自身先实际校验一次——演练面（分支/dispatch）跑的就是
        # 与发布完全相同的 checksum 语义。
        run: cd release-assets && sha256sum -c SHA256SUMS.txt
      - name: Upload assembled release assets
        # 名称刻意避开 reviewflow-* 前缀：不会被本作业的 pattern 下载
        # 捕获；publish 按 name 精确取这一份已验证的七件资产包
        # （六载荷 + SHA256SUMS.txt）。
        uses: actions/upload-artifact@v6
        with:
          name: desktop-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          # F1 (2.1.6 R1)：包名固定，同一 run 重跑必须显式覆盖旧上传。
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: assemble
    # REL-01（2.1.6，主控裁定）：只有 push 标签事件进入写权限发布——
    # release/** 分支推送与 workflow_dispatch 演练（即使手动选择标签 ref）
    # 一律只构建上传。2.1.5 曾实证 branch push 可发正式版（run 43541772593），
    # 此 if 收口该触发面；P1-1 三重标签守卫（下方步骤）原样保留继续生效。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    # L-03：写权限只在 publish 显式授予（打标签/推标签/建发行版）；
    # checkout 保持默认持久化凭据——git push 标签依赖它。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Read application version
        shell: bash
        run: echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Download assembled release assets
        # REL-02b：按名取 assemble 已验证的完整资产包（desktop-release-assets，
        # 七件=六载荷+SHA256SUMS.txt）——不再 pattern 合并平台产物。
        uses: actions/download-artifact@v7
        with:
          name: desktop-release-assets
          path: release-assets
      - name: Verify release asset completeness
        run: |
          # REL-02（2.1.6）：assemble 已验过一次；发布侧在 checksum 校验前
          # 再确认六载荷齐全（防资产包在汇集后被替换或缺件的双保险）。
          cd release-assets
          missing=0
          for f in ReviewFlow-Setup-x64.exe ReviewFlow.dmg ReviewFlow-x86_64.AppImage \
                   build-manifest-windows.json build-manifest-macos.json build-manifest-linux.json; do
            if [ ! -f "$f" ]; then
              echo "::error::missing release asset: $f" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release assets incomplete; refusing to publish" >&2
            exit 1
          fi
      - name: Verify checksums
        # REL-02b：SHA256SUMS.txt 由 assemble 生成；发布侧在任何 tag/push/
        # release 动作之前对照实文件再验一次（防汇集后、发布前被篡改）。
        run: cd release-assets && sha256sum -c SHA256SUMS.txt
      - name: Point release tag to this build (P1-1 tag guards)
        run: |
          # P1-1（发布前对抗审查 2026-11-11，本地裸仓库 12 组复现：4 组改写
          # 已有标签、3 组触发标签与 VERSION 不一致仍成功）三重守卫：
          # ①标签触发时，触发标签必须与 VERSION 一致（防错版发布）；
          # ②远端已有标签且指向不同提交 → 拒绝改写（防覆盖上一版本标签；
          #   原实现无条件 tag -f + push --force）；
          # ③远端标签指向本提交 → 幂等重跑放行。
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF" != "refs/tags/v${APP_VERSION}" ]; then
            echo "::error::trigger tag ${GITHUB_REF} does not match VERSION ${APP_VERSION}; refusing to publish" >&2
            exit 1
          fi
          tag_ref="refs/tags/v${APP_VERSION}"
          existing="$(git ls-remote origin "$tag_ref" "${tag_ref}^{}")"
          if [ -n "$existing" ]; then
            # An annotated tag has a tag object and a peeled commit. A
            # lightweight tag has only the commit row. Prefer the peeled row.
            current="$(awk -v ref="$tag_ref" '$2 == ref { raw = $1 } $2 == (ref "^{}") { peeled = $1 } END { print (peeled == "" ? raw : peeled) }' <<< "$existing")"
            if [ "$current" != "$GITHUB_SHA" ]; then
              echo "::error::tag v${APP_VERSION} already exists at ${current}; refusing to move it to ${GITHUB_SHA}. Bump VERSION or delete the tag deliberately." >&2
              exit 1
            fi
          else
            # A non-forced push refuses a conflicting tag created concurrently.
            git tag "v${APP_VERSION}" "$GITHUB_SHA"
            git push origin "$tag_ref"
          fi
      - name: Create versioned release and upload installers
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: 木笔 ReviewFlow ${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          # 用户口径裁定 2026-11-13：发布页不列逐提交清单（开发细节）；
          # 正文只用 RELEASE_NOTES.md（产品语言），完整历史见 CHANGELOG.md。
          generate_release_notes: false
          files: release-assets/*
