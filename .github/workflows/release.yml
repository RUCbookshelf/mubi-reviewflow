name: Build and publish desktop releases

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

# L-03（r7-lunafix）最小权限：workflow 级只读——build/publish 原先各自
# 继承 contents: write，构建/测试步骤（pip 安装、pytest、校验器）因此持有
# 写令牌（供应链爆炸半径）。写权限只下沉到真正打标签/建发行版的 publish
# 作业；build 的 checkout 不把凭据持久化进本地 git 配置。
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            command: windows
            artifact: ReviewFlow-Setup-x64.exe
          - platform: macos-arm64
            runner: macos-15
            command: macos
            artifact: ReviewFlow.dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            command: linux
            artifact: ReviewFlow-x86_64.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # L-03：构建/测试作业不需要凭据——不把令牌留进本地 git 配置
          #（后续 pip 安装/pytest/校验器执行的代码一律拿不到写凭据）。
          persist-credentials: false
      - name: Read application version
        shell: bash
        run: echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        if: matrix.command == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config libfuse2
      - name: Install macOS Cairo rendering library
        if: matrix.command == 'macos'
        shell: bash
        run: |
          brew install cairo
          cairo_lib="$(brew --prefix cairo)/lib"
          test -f "$cairo_lib/libcairo.2.dylib"
          echo "REVIEWFLOW_CAIRO_LIB_DIR=$cairo_lib" >> "$GITHUB_ENV"
      - name: Install Windows installer compiler
        if: matrix.command == 'windows'
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        if: matrix.command == 'windows'
        shell: cmd
        run: build\build_windows.bat __inner__
      - name: Build macOS disk image
        if: matrix.command == 'macos'
        env:
          REVIEWFLOW_MACOS_ARCH: arm64
        run: bash build/build_macos.sh
      - name: Build Linux AppImage
        if: matrix.command == 'linux'
        run: bash build/build_linux.sh
      - name: Collect release file
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ matrix.command }}" = windows ]; then
            cp build/Output/${{ matrix.artifact }} release-assets/
          else
            cp build/dist/${{ matrix.artifact }} release-assets/
          fi
      - name: Provision playwright for the browser regression
        shell: bash
        run: |
          # MM9-01: the only browser regression in the release gate
          # (build/tests/import_review_browser.cjs, spawned by
          # test_r7_mm7_relchain.py) is skipif-gated on BOTH
          # REVIEWFLOW_PLAYWRIGHT (a require() path to the playwright module,
          # the convention every build/tests/*.cjs harness uses) and
          # PLAYWRIGHT_BROWSERS_PATH (the browser cache). Without this step
          # the gate ships zero browser coverage while looking green.
          pw_root="$RUNNER_TEMP/reviewflow-playwright"
          npm install --prefix "$pw_root" "playwright@>=1.55.0 <2"
          pw_cli="$pw_root/node_modules/playwright/cli.js"
          if [ "${{ matrix.command }}" = "linux" ]; then
            PLAYWRIGHT_BROWSERS_PATH="$pw_root/browsers" node "$pw_cli" install --with-deps chromium
          else
            PLAYWRIGHT_BROWSERS_PATH="$pw_root/browsers" node "$pw_cli" install chromium
          fi
          {
            echo "REVIEWFLOW_PLAYWRIGHT=$pw_root/node_modules/playwright"
            echo "PLAYWRIGHT_BROWSERS_PATH=$pw_root/browsers"
          } >> "$GITHUB_ENV"
      - name: Verify versioned application payload
        run: python build/verify_release_payload.py ${{ matrix.command }}
      - name: Run static validators
        shell: bash
        env:
          PYTHONUTF8: "1"
          # r9 系测试的可写根：本地缺省 E:/rf214tmp（本波期 C: 盘满的历史
          # 原因），CI 无 E: 盘——模块级 mkdir 在收集期直接 FileNotFoundError
          # （2026-11-13 windows-x64 实红）。五个 r9 文件统一走此逃生门。
          RF_R9_TMP: ${{ runner.temp }}
          # 2026-11-13 全域扫除：另有 10 个 py+3 个 cjs 在运行期硬编码
          # E:/rf214tmp（本地有 E: 盘从未暴露）——已全部改写为可覆写。
          # 注意：不加子目录后缀——r9-l6b/l7c 的深链任务备份文件名极长
          # （research-trace pre-migration bak ≈107 字符），Windows MAX_PATH
          # 260 贴边，根每多一级即爆（f1_72 教训：开发者当年挪 E: 盘即此因）。
          RF_R9_TMP_ROOT: ${{ runner.temp }}
        run: |
          # MM7-02: the four static validators run in CI after the payload check;
          # any non-zero exit fails the job. httpx is used by the two Python
          # validators and is not part of the runtime requirements file;
          # pyyaml is used by build/tests/test_r7_luna_release_static.py (L-03).
          python -m pip install --disable-pip-version-check -r build/requirements-app.txt httpx pytest pyyaml
          if [ "${{ matrix.command }}" = macos ]; then
            export DYLD_LIBRARY_PATH="$REVIEWFLOW_CAIRO_LIB_DIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          fi
          # MM8-02: the test suite (1,222+ assertions) runs in CI before the
          # validators; any failure fails the job.
          # P2（发布前对抗审查 2026-11-11）：与本地门禁的分段口径对齐——
          # test_w4_study_design 与 test_r6_undo_collab_fixes 存在存量跨文件
          # 状态泄漏（w4 模块级 fixture 对 main 单例的污染，stash 验证非新引入），
          # 同进程联跑 5 败、分进程 35+24 全绿；根因修复另立工单，CI 先分段。
          # 2026-11-13（CI 静态钉收口）：再添三件同病受害者——ai_formats/
          # auth_remember_reset/upload_security 独立跑全绿、整目录必红
          # （模块级 env 串扰，本地 30 分钟复现实证 34F+16E）；分段名单扩至五件。
          python -m pytest build/tests -q \
            --ignore=build/tests/test_w4_study_design.py \
            --ignore=build/tests/test_r6_undo_collab_fixes.py \
            --ignore=build/tests/test_2_1_5_ai_formats.py \
            --ignore=build/tests/test_2_1_5_auth_remember_reset.py \
            --ignore=build/tests/test_upload_security_regression.py
          python -m pytest build/tests/test_w4_study_design.py -q
          python -m pytest build/tests/test_r6_undo_collab_fixes.py -q
          python -m pytest build/tests/test_2_1_5_ai_formats.py -q
          python -m pytest build/tests/test_2_1_5_auth_remember_reset.py -q
          python -m pytest build/tests/test_upload_security_regression.py -q
          python build/validate_import_review.py
          python build/validate_screening_rounds.py
          node build/validate_import_review_static.cjs
          node build/validate_team_prisma_static.js
          # MM11-01: the three node --test unit suites (17 cases) were
          # documentation-only - no automation ever ran them. They ride the
          # same node-on-PATH precondition as the two node validators above
          # (every matrix runner image ships node) and run from the checkout
          # root: ml_batch.test.cjs reads custom_frontend/index.html relative
          # to the working directory.
          # W2 (2.1.4-r8): pdf_fetch_ui.test.cjs nails the PDF auto-fetch
          # frontend module (default-off zero-render, three outcome paths,
          # ten-language corpus). Local-green only would leave it unguarded
          # on every release platform, so it joins the same node --test run.
          # W3 (2.1.4-r8): living_review.test.cjs nails the revived PubMed
          # check (manual check-now wiring, graceful 409 degradation, and the
          # sliced in-session timer that must never overflow the 32-bit delay).
          node --test build/tests/import_review_model.test.cjs \
                      build/tests/import_review_updates.test.cjs \
                      build/tests/ml_batch.test.cjs \
                      build/tests/study_design_badge.test.cjs \
                      build/tests/pdf_fetch_ui.test.cjs \
                      build/tests/living_review.test.cjs \
                      build/tests/auth_remember_reset.test.cjs \
                      build/tests/ai_providers_wizard.test.cjs \
                      build/tests/ai_import_bulk.test.cjs \
                      build/tests/aiux_locale.test.cjs \
                      build/tests/analysis_grade_ui.test.cjs \
                      build/tests/analysis_rob_locale.test.cjs \
                      build/tests/import_review_review67.test.cjs \
                      build/tests/report_evidence_ui.test.cjs \
                      build/tests/ai_settings_drafts.test.cjs \
                      build/tests/analysis_rob_editor_ui.test.cjs \
                      build/tests/table_wizards_polish.test.cjs \
                      build/tests/workflow_evidence_save_ui.test.cjs \
                      build/tests/workflow_ui_polish.test.cjs \
                      build/tests/import_ai_ui_polish.test.cjs \
                      build/tests/app_module_loader.test.cjs \
                      build/tests/ui_polish_core.test.cjs \
                      build/tests/ui_polish_recovery.test.cjs \
                      build/tests/screen_reader_e10.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: reviewflow-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    # L-03：写权限只在 publish 显式授予（打标签/推标签/建发行版）；
    # checkout 保持默认持久化凭据——git push 标签依赖它。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read application version
        shell: bash
        run: echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: reviewflow-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt
      - name: Point release tag to this build (P1-1 tag guards)
        run: |
          # P1-1（发布前对抗审查 2026-11-11，本地裸仓库 12 组复现：4 组改写
          # 已有标签、3 组触发标签与 VERSION 不一致仍成功）三重守卫：
          # ①标签触发时，触发标签必须与 VERSION 一致（防错版发布）；
          # ②远端已有标签且指向不同提交 → 拒绝改写（防覆盖上一版本标签；
          #   原实现无条件 tag -f + push --force）；
          # ③远端标签指向本提交 → 幂等重跑放行。
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF" != "refs/tags/v${APP_VERSION}" ]; then
            echo "::error::trigger tag ${GITHUB_REF} does not match VERSION ${APP_VERSION}; refusing to publish" >&2
            exit 1
          fi
          tag_ref="refs/tags/v${APP_VERSION}"
          existing="$(git ls-remote origin "$tag_ref" "${tag_ref}^{}")"
          if [ -n "$existing" ]; then
            # An annotated tag has a tag object and a peeled commit. A
            # lightweight tag has only the commit row. Prefer the peeled row.
            current="$(awk -v ref="$tag_ref" '$2 == ref { raw = $1 } $2 == (ref "^{}") { peeled = $1 } END { print (peeled == "" ? raw : peeled) }' <<< "$existing")"
            if [ "$current" != "$GITHUB_SHA" ]; then
              echo "::error::tag v${APP_VERSION} already exists at ${current}; refusing to move it to ${GITHUB_SHA}. Bump VERSION or delete the tag deliberately." >&2
              exit 1
            fi
          else
            # A non-forced push refuses a conflicting tag created concurrently.
            git tag "v${APP_VERSION}" "$GITHUB_SHA"
            git push origin "$tag_ref"
          fi
      - name: Create versioned release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: 木笔 ReviewFlow ${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          # 用户口径裁定 2026-11-13：发布页不列逐提交清单（开发细节）；
          # 正文只用 RELEASE_NOTES.md（产品语言），完整历史见 CHANGELOG.md。
          generate_release_notes: false
          files: release-assets/*
