<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewFlow — Import review concept</title><style> :root{--primary:#2f6f6a;--primary-light:#e3f2f0;--primary-dark:#234f4b;--ink:#1f2a37;--muted:#5b6b78;--border:#dde6e4;--surface:#fff;--bg:#f7fbf9;--font-body:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body)}body.dark{--primary:#62a29d;--primary-light:#163330;--primary-dark:#8fc3bd;--ink:#e6edf3;--muted:#9db0be;--border:#3a4553;--surface:#161b22;--bg:#0d1117}.top{position:sticky;top:0;z-index:20;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top b{margin-right:auto}.preview-label{background:var(--primary-light);padding:4px 9px;border-radius:6px;font-size:12px}.workspace{max-width:1300px;margin:auto;padding:28px 24px 40px 24px}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}.btn,select{font:inherit;border:1px solid var(--primary);border-radius:8px;background:var(--surface);color:var(--primary-dark);padding:8px 12px;cursor:pointer}.btn:disabled{opacity:.5;cursor:default}.sm{font-size:13px}.hint{color:var(--muted);font-size:13px}h4{font-size:20px;margin:24px 0 12px}h5{font-size:16px;margin:8px 0}p{margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}button:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:3px}[hidden]{display:none!important}#dropZone{margin-bottom:20px;padding:16px;border:1px dashed var(--border);border-radius:10px}#rfImportGuide .rf-guide-body>button{margin-top:10px}</style><body><main id="appMain"><header class="top"><b>木笔 ReviewFlow</b><span class="preview-label">Interactive concept · fictional data</span><button class="btn sm" onclick="document.body.classList.toggle('dark')">Light / dark</button><button class="btn sm" onclick="location.reload()">Reset demo</button></header><div class="workspace"><h1>Import literature</h1><p class="hint" id="preview-status">Try Keep existing / Accept incoming, then Activate. All actions affect this demo only.</p><section data-p="import"><div id="dropZone">✓ WOS-demo.ris and Scopus-demo.ris imported</div><div id="titleDupWrap" hidden></div></section><div id="wf-pending-imports" hidden></div><button id="goScreenBtn" class="btn">Continue to screening</button></div></main><script>
const previewWords={'引导-导入文献':'Guide — Import literature','导入文献':'Import literature','检查轨迹是否开启':'Open Trace','导入已暂存，等待核验与激活。':'Review the incoming changes, then activate resolved records.','完成所有待办后，引导卡片自动关闭。':'The guide closes automatically when every step is complete.','已完成':'Completed','待完成':'To do','收起为胶囊':'Collapse to a pill','展开引导':'Expand guide'};
const $=s=>document.querySelector(s),T=(s,...args)=>(window.fixtureTranslate?.(s)||previewWords[s]||s).replace(/\{(\d+)\}/g,(_,i)=>args[i]??'{'+i+'}');
function el(tag,attrs={}){const x=document.createElement(tag);for(const [k,v]of Object.entries(attrs)){if(k==='text')x.textContent=v;else if(k==='onclick')x.onclick=v;else x.setAttribute(k,v);}return x;}
const S={user:{username:'Preview owner'},task:{task_id:'fictional'},screener:'Preview owner',page:'import'};
const taskApi=()=>'/fixture',scrQ=()=>'',refreshProgress=async()=>{},renderImportReport=()=>{};
const WorkflowControls={scope:()=> 'fictional',settings:()=>({can_manage:true}),version:()=>1,refresh:async()=>{},error:e=>alert(e.message),errorText:e=>e.message};
const stamp='2026-10-12T09:30:00',bid='preview-batch-fictional';
const existing={title:'Teachers’ professional identity: a longitudinal study',authors:'Rivera, Ana; Chen, Mei',year:2023,journal:'Teaching and Teacher Education',doi:'10.example/identity',abstract:'A longitudinal investigation of teachers’ professional identity using interviews and classroom observations.',item_type:'JOUR',url:''};
let records;
function reset(){records=[{record_id:'meta',state:'staged',attention_reason:'metadata',filename:'WOS-demo.ris',row_locator:'Record 8',article:existing,original:{TY:'JOUR',TI:existing.title},metadata:{before:existing,incoming:{...existing,title:'Teachers’ professional identity: a three-year longitudinal study',year:2024,abstract:existing.abstract+' The incoming record supplies a revised abstract and publication year.'},action:null}},{record_id:'ready',state:'staged',attention_reason:'ready',filename:'Scopus-demo.ris',row_locator:'Record 12',article:{title:'Reflective practice in language teacher education'},original:{TY:'JOUR'}}];for(let i=0;i<6;i++)records.push({record_id:'done'+i,state:'active',attention_reason:'completed',filename:'WOS-demo.ris',row_locator:'Record '+(i+1),article:{title:['Teacher agency and professional development','Narrative inquiry in teacher education','Classroom discourse and learner participation'][i%3]},original:{TY:'JOUR'}});localStorage.removeItem('rf_import_guide:'+JSON.stringify(['Preview owner','fictional','Preview owner']));}
reset();
function summary(){return{pending_records:records.filter(r=>r.state==='staged').length,metadata_review_count:records.filter(r=>r.metadata?.action===null).length,pending_candidate_groups:0,can_manage:true};}
async function api(url,options={}){await new Promise(r=>setTimeout(r,100));if(options.method==='POST'){if(url.endsWith('/activate'))for(const r of records)if(r.state==='staged'&&r.metadata?.action!==null){r.state='active';r.attention_reason='completed';}else{}else if(url.includes('/metadata/')){const r=records.find(r=>r.record_id===url.split('/').pop());r.metadata.action=options.body.action;r.attention_reason='ready';if(options.body.action==='accept_incoming')r.article=r.metadata.incoming;}return{};}
if(options.blob)return new Blob(['Preview only — fictional records'],{type:'text/csv'});
if(url.includes('import-review-summary'))return summary();
if(url.includes('title-duplicate-reviews'))return{progress:{candidate_groups:0,pending_groups:0}};
if(url.includes('import-history'))return{pending_import_records:summary().pending_records,imports:[{result:{imported:8}}]};
if(url.includes('/progress'))return{stage1:{total:6}};
if(url.includes('/candidates'))return{total:0,candidates:[],next_offset:null};
const base={...summary(),batch_id:bid,created_at:stamp,files:[{filename:'WOS-demo.ris'},{filename:'Scopus-demo.ris'}],raw_source_records:records.length,active_records:records.filter(r=>r.state==='active').length};
if(url.match(/import-batches\?/))return{batches:[base],total:1};
const completed=records.filter(r=>r.attention_reason==='completed'),attention=records.filter(r=>r.attention_reason!=='completed'),ready=attention.filter(r=>r.attention_reason==='ready').length;
const list=url.includes('view=completed')?completed:attention;
return{...base,records:structuredClone(list),view:url.includes('view=completed')?'completed':'attention',view_total:list.length,next_offset:null,review_counts:{attention:attention.length,completed:completed.length,ready,needs_review:attention.length-ready}};}
async function go(page){if(page==='trace'){document.querySelector('#preview-status').textContent='Preview: Trace opened. No research data was changed.';return true;}S.page='import';return true;}
</script></body></html>
